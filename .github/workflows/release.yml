name: Deploy Spring Boot

on:
  push:
    branches:
      - release
jobs:
  deploy:
    runs-on: [self-hosted, Web-Server]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Grant Gradle Permission
        run: chmod +x ./gradlew
      - name: Build
        run: ./gradlew clean bootJar -x test
      - name: Deploy
        run: |
          mkdir -p /home/hskgroup-ubuntu/app
          cp build/libs/*.jar /home/hskgroup-ubuntu/app/app.jar
          sudo systemctl restart spring-app
