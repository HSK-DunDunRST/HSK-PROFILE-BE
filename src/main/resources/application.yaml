spring:
  application:
    name: LocalBackEnd
  web:
    resources:
      add-mappings: false

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: true
    properties:
      hibernate.format_sql: true
      dialect: org.hibernate.dialect.MySQL8InnoDBDialect

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

server:
  servlet:
    context-path: /api/v1
  port: 8080

security:
  jwt:
    secret: ${JWT_SECRET:Change-me}
    issuer: ${JWT_ISSUER:HSKGroup}
    access-token-expiration-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-expiration-days: ${JWT_REFRESH_DAYS:7}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}

logging:
  level:
    org.hibernate.SQL: debug
    org.springframework.cache: trace
